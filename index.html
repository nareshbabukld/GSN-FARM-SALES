<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Sales">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f7a3d">
<title>Broiler Farm Sales</title>
<style>
:root{--g:#1f7a3d;--gd:#14582b;--gl:#e6f3ea;--bg:#f3f5f1;--card:#fff;--ink:#1d2a22;--mut:#5f6b64;--line:#d9e0d6;--red:#c62828;--amb:#b26a00}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 10px calc(14px + env(safe-area-inset-left,0px));position:sticky;top:0;z-index:5}
.hd{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.hd img{height:34px;border-radius:6px;background:#fff}
.hd small{display:block;opacity:.85;font-size:12px}
main{max-width:980px;margin:0 auto;padding:12px}
h2{margin:6px 0 10px;font-size:20px}
h3{margin:12px 0 6px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:720px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{color:var(--mut);display:block}
.stat b{font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 0}
input,select,textarea{width:100%;font:inherit;padding:11px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);margin-top:3px;min-height:46px}
input:focus,select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px #1f7a3d33}
input[readonly]{background:#f0f2ef;color:var(--mut)}
input[type=checkbox]{width:auto;min-height:0;margin-right:6px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;min-height:48px;cursor:pointer;background:var(--g);color:#fff;text-align:center;text-decoration:none;display:inline-block}
button.sec,.btn.sec{background:#fff;color:var(--g);border:1.5px solid var(--g)}
button.red{background:var(--red)}
button.sm{min-height:36px;padding:6px 12px;font-size:14px}
button.big{width:100%;font-size:18px;min-height:56px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.row.nf>*{flex:none}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;background:#fff;color:var(--g);border:1.5px solid var(--g)}
.tabs button.on{background:var(--g);color:#fff}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pills input{position:absolute;opacity:0;width:0;min-height:0}
.pills label{flex:1;margin:0;text-align:center;padding:12px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:600;min-width:70px}
.pills input:checked+span{display:block}
.pills label:has(input:checked){background:var(--gl);border-color:var(--g);color:var(--gd)}
.hide{display:none!important}
.sum{background:var(--gl);border:1.5px solid var(--g);border-radius:12px;padding:10px 12px;margin:12px 0}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .big{font-size:22px;font-weight:700}
.red-t{color:var(--red)}.green-t{color:var(--g)}.mut{color:var(--mut)}
nav{padding-bottom:env(safe-area-inset-bottom,0px);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav a{flex:1;text-align:center;padding:8px 2px 10px;color:var(--mut);text-decoration:none;font-size:12px}
nav a span{display:block;font-size:22px;line-height:1.1}
nav a.on{color:var(--g);font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:#eef2ec;cursor:pointer;position:sticky;top:0;user-select:none}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;background:#f6f8f4}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border:0}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--gl);color:var(--gd)}
.badge.r{background:#fdeaea;color:var(--red)}
.badge.a{background:#fff3df;color:var(--amb)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:12px 16px;border-radius:10px;z-index:30;max-width:92%;display:none}
#toast.err{background:var(--red)}
#sheet{position:fixed;inset:0;background:#0006;z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sh{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
@media(min-width:720px){#sheet{align-items:center}.sh{border-radius:16px}}
.shh{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.x{background:none;color:var(--ink);min-height:36px;padding:4px 10px;font-size:20px}
.auth{max-width:420px;margin:30px auto;padding:0 14px}
.warn{background:#fff3df;border:1px solid #f0c987;border-radius:10px;padding:10px;margin-bottom:10px;color:#6b4300}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
@media(min-width:720px){.filters{grid-template-columns:repeat(4,1fr)}}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.rc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.rc hr{border:0;border-top:1px dashed #999}
.rc .l{display:flex;justify-content:space-between}
@media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff;padding:0}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(n)?0:n;};
const fm=n=>(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fw=n=>(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:3,maximumFractionDigits:3});
const pad=(n,l)=>String(n).padStart(l,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);
const today=()=>ymd(new Date());
const monthStart=()=>today().slice(0,8)+'01';
const addDays=(d,n)=>ymd(new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8)+n));
const dmy=d=>d?d.slice(8,10)+'-'+d.slice(5,7)+'-'+d.slice(0,4):'';
const fyOf=date=>{const y=+date.slice(0,4),m=+date.slice(5,7),s=m>=4?y:y-1;return s+'-'+pad((s+1)%100,2);};
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
const pwh=(u,p)=>hash('bf|'+String(u).toLowerCase()+'|'+p);

/* ===== database (browser storage; the real build uses MySQL) ===== */
const KEY='bfsms_v1',SKEY='bfsms_session';
const PM=['Cash','PhonePe','Google Pay','Paytm','UPI','Bank Transfer'];
const OPREP=['daily-sales','retail-sales','wholesale-sales','outstanding','collection'];
let db=null,me=null,ROUTE='/home';
const S={type:'RETAIL',dash:today(),unlock:false,auth:'login',R:{},cur:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Storage full or blocked: '+e.message,1);}}
function nid(k){db.seq[k]=(db.seq[k]||0)+1;return db.seq[k];}
function audit(action,table,rec,detail){db.audit.push({id:nid('audit'),at:new Date().toISOString(),user:me?me.username:'system',action,table,rec:rec==null?'':rec,detail:detail||''});if(db.audit.length>3000)db.audit.splice(0,500);}
const cust=id=>db.customers.find(c=>c.id===+id);
const sale=id=>db.sales.find(s=>s.id===+id);
const cname=id=>id?(cust(id)?cust(id).name:'?'):'Walk-in';
const isAdmin=()=>!!me&&me.role==='ADMIN';
const canOv=u=>u.role==='ADMIN'||!!u.canOverride;
const liveSales=()=>db.sales.filter(s=>s.status==='ACTIVE');
const livePay=()=>db.payments.filter(p=>p.status==='ACTIVE');
const isClosed=d=>!!db.closes[d];
function custBalance(id){for(let i=db.ledger.length-1;i>=0;i--)if(db.ledger[i].customerId===+id)return db.ledger[i].balance;return 0;}
function ledgerAdd(cid,date,type,saleId,payId,debit,credit,note){const bal=r2(custBalance(cid)+debit-credit);db.ledger.push({id:nid('ledger'),customerId:+cid,date,type,saleId:saleId||null,payId:payId||null,debit:r2(debit),credit:r2(credit),balance:bal,note:note||''});}
function getRate(date){const act=db.rates.filter(r=>r.active&&r.date<=date);if(!act.length)return null;const md=act.reduce((m,r)=>r.date>m?r.date:m,'');return act.filter(r=>r.date===md).reduce((a,b)=>b.id>a.id?b:a);}

function seed(){
  db={v:1,seq:{},users:[],company:{name:'My Broiler Farm Company',farmName:'Green Valley Broiler Farm',address:'Rampur Village, Main Road',mobile:'9876500100',gst:'',logo:'',fy:'2026-27',currency:'INR',openingCash:20000},rates:[],customers:[],sales:[],payments:[],ledger:[],audit:[],counters:{},closes:{}};
  const U=(un,name,mob,pw,role,ov)=>db.users.push({id:nid('user'),username:un,name,mobile:mob,email:un+'@example.com',pw:pwh(un,pw),role,canOverride:ov,active:true,fails:0,lockUntil:0,createdAt:new Date().toISOString()});
  U('admin','Farm Admin','9876500100','Admin@123','ADMIN',true);
  U('operator1','Counter Staff 1','9876500101','Oper@123','OPERATOR',false);
  U('operator2','Counter Staff 2','9876500102','Oper@456','OPERATOR',true);
  const R=(date,at,rt,wh,rm)=>db.rates.push({id:nid('rate'),date,retail:rt,wholesale:wh,remarks:rm,active:true,createdAt:date+'T'+at,createdBy:'admin'});
  R('2026-10-26','08:00:00',135,125,'Morning rate');R('2026-10-27','08:00:00',138,128,'Morning rate');R('2026-10-27','11:30:00',140,128,'Retail raised, market up');
  me=db.users[0];
  [['Ramesh Poultry Shop','9876500001','Rampur',50000,7000],['Lakshmi Hotel','9876500002','Gandhinagar',30000,0],['Suresh Meat Stall','9876500003','Rampur',20000,2500],['Anwar Biryani Point','9876500004','Market Road',40000,0],['Mary Catering','9876500005','Church Street',25000,12000]]
   .forEach(c=>addCustomer({name:c[0],mobile:c[1],village:c[2],address:c[2],creditLimit:c[3],openingBalance:c[4]},'2026-10-01'));
  const d='2026-10-27';
  createSale({type:'RETAIL',date:d,birds:'3',weight:'6.45',rate:'140',discount:'3',mode:'CASH',cash:'1000',upi:''},me);
  createSale({type:'RETAIL',date:d,birds:'5',weight:'10',rate:'140',discount:'0',mode:'MIXED',cash:'900',upi:'500'},me);
  createSale({type:'WHOLESALE',date:d,customerId:1,birds:'60',weight:'118.45',rate:'128',discount:'0',freight:'300',mode:'UPI',cash:'',upi:'10000'},me);
  createSale({type:'WHOLESALE',date:d,customerId:2,birds:'40',weight:'80.2',rate:'128',discount:'0',freight:'0',mode:'CASH',cash:'5000',upi:''},me);
  me=null;db.audit=[];
}
function load(){try{db=JSON.parse(localStorage.getItem(KEY));}catch(e){db=null;}if(!db||!db.v){seed();save();}}

/* ===== business logic ===== */
function addCustomer(f,date){
  const name=String(f.name||'').trim();if(!name)throw new Error('Enter customer name');
  const mob=String(f.mobile||'').trim();
  if(mob&&!/^\d{10}$/.test(mob))throw new Error('Mobile number must be 10 digits');
  if(mob&&db.customers.some(c=>c.mobile===mob))throw new Error('This mobile number already exists');
  const ob=r2(num(f.openingBalance));
  const c={id:nid('cust'),name,mobile:mob,address:f.address||'',village:f.village||'',creditLimit:r2(num(f.creditLimit)),openingBalance:ob,openRem:Math.max(0,ob),active:true,createdAt:new Date().toISOString()};
  db.customers.push(c);
  if(ob!==0)ledgerAdd(c.id,date||today(),'OPENING',null,null,ob>0?ob:0,ob<0?-ob:0,'Opening balance');
  audit('CUSTOMER_ADD','customers',c.id,name);return c;
}
function nextNo(series,date){const fy=fyOf(date),k=series+fy;db.counters[k]=(db.counters[k]||0)+1;return series+'-'+fy+'-'+pad(db.counters[k],6);}
function addPayment(p){const row={id:nid('pay'),no:'PM-'+pad(db.seq.pay+1,6),date:p.date,customerId:p.customerId||null,saleId:p.saleId||null,amount:r2(p.amount),mode:p.mode,remarks:p.remarks||'',kind:p.kind,alloc:p.alloc||[],status:'ACTIVE',createdBy:me?me.username:'system',createdAt:new Date().toISOString()};row.no='PM-'+pad(row.id,6);db.payments.push(row);return row;}

function createSale(f,u){
  const ret=f.type==='RETAIL',date=f.date;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))throw new Error('Select a valid date');
  if(isClosed(date)&&u.role!=='ADMIN')throw new Error('This day is closed. Ask the Admin.');
  const birds=num(f.birds),weight=num(f.weight);
  if(!(birds>0)||birds!==Math.floor(birds))throw new Error('Enter the number of birds (whole number)');
  if(!(weight>0))throw new Error('Enter the total weight in kg');
  const rt=getRate(date),cur=rt?(ret?rt.retail:rt.wholesale):0,rate=num(f.rate);
  if(!(rate>0))throw new Error('Enter the rate per kg');
  let src='AUTO';
  if(r2(rate)!==r2(cur)){
    if(!canOv(u))throw new Error(cur?'You are not allowed to change the rate':'No rate set for this date. Ask the Admin to set the rate.');
    src='OVERRIDE';
  }
  const gross=r2(weight*rate),disc=r2(num(f.discount)),fr=ret?0:r2(num(f.freight));
  if(ret&&num(f.freight)>0)throw new Error('Freight charges are only for wholesale');
  if(disc<0||fr<0)throw new Error('Discount and freight cannot be negative');
  if(disc>gross)throw new Error('Discount cannot be more than the gross amount');
  const net=r2(gross-disc+fr);
  const cid=f.customerId?+f.customerId:null;
  if(!ret&&!cid)throw new Error('Select a customer for a wholesale sale');
  if(cid&&!cust(cid))throw new Error('Customer not found');
  let mode=f.mode,cash=0,upi=0;
  if(ret){
    if(mode==='CASH'){if(f.cash===''||f.cash==null)throw new Error('Enter the money received');cash=num(f.cash);}
    else if(mode==='UPI'){if(f.upi===''||f.upi==null)throw new Error('Enter the money received');upi=num(f.upi);}
    else{mode='MIXED';if((f.cash===''||f.cash==null)&&(f.upi===''||f.upi==null))throw new Error('Enter the money received');cash=num(f.cash);upi=num(f.upi);}
  }else{
    if(mode==='CASH')cash=num(f.cash);else if(mode==='UPI')upi=num(f.upi);else if(mode==='MIXED'){cash=num(f.cash);upi=num(f.upi);}else mode='CREDIT';
  }
  if(cash<0||upi<0)throw new Error('Amounts cannot be negative');
  const received=r2(cash+upi);let change=0,balance;
  if(ret){change=r2(Math.max(0,received-net));if(change>cash+0.001)throw new Error('Change to return cannot be more than the cash received');balance=r2(Math.max(0,net-received));}
  else{if(received>net+0.005)throw new Error('Amount received cannot be more than the net amount');balance=r2(net-received);}
  const cashCol=r2(cash-change),upiCol=r2(upi),collected=r2(cashCol+upiCol);
  if(balance>0&&!cid)throw new Error('Select a customer so the unpaid amount can be kept as balance');
  if(cid&&balance>0){const c=cust(cid),after=r2(custBalance(cid)+balance);
    if(c.creditLimit>0&&after>c.creditLimit){
      if(u.role!=='ADMIN')throw new Error('Credit limit exceeded. Balance would be '+fm(after)+' against limit '+fm(c.creditLimit));
      audit('CREDIT_LIMIT_OVERRIDE','customers',cid,'Balance '+fm(after)+' over limit '+fm(c.creditLimit));}}
  const s={id:nid('sale'),invoiceNo:nextNo(ret?'RT':'WS',date),type:f.type,date,customerId:cid,birds,weight:r2(weight),rate:r2(rate),rateSource:src,gross,discount:disc,freight:fr,net,received,change,balance,mode,status:'ACTIVE',cancelReason:'',createdBy:u.username,createdAt:new Date().toISOString()};
  s.items=[{birds,weight:s.weight,rate:s.rate,rateSource:src,amount:gross}];
  db.sales.push(s);
  const keep=me;me=u;
  if(cashCol>0)addPayment({date,customerId:cid,saleId:s.id,amount:cashCol,mode:'Cash',kind:'AT_SALE'});
  if(upiCol>0)addPayment({date,customerId:cid,saleId:s.id,amount:upiCol,mode:'UPI',kind:'AT_SALE'});
  if(cid){ledgerAdd(cid,date,'INVOICE',s.id,null,net,0,s.invoiceNo);if(collected>0)ledgerAdd(cid,date,'PAYMENT',s.id,null,0,collected,'Received at sale');}
  if(src==='OVERRIDE')audit('RATE_OVERRIDE','sales',s.id,'Rate '+rate+' instead of '+cur);
  audit('SALE_CREATE','sales',s.id,s.invoiceNo+' net '+net);
  me=keep;
  return s;
}
function openItems(cid){const c=cust(cid),a=[];if(c.openRem>0)a.push({ref:'OPENING',rem:c.openRem});db.sales.filter(s=>s.customerId===+cid&&s.status==='ACTIVE'&&s.balance>0).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(s=>a.push({ref:s.id,rem:s.balance}));return a;}
function allocate(cid,amount,saleId){
  const c=cust(cid),items=openItems(cid),out=[];let left=r2(amount);
  if(saleId){const it=items.find(i=>i.ref===+saleId);if(!it)throw new Error('That invoice has nothing due');if(amount>it.rem+0.005)throw new Error('Payment is more than the invoice balance ('+fm(it.rem)+')');out.push({ref:it.ref,amt:r2(amount)});left=0;}
  else for(const it of items){if(left<=0)break;const a=r2(Math.min(left,it.rem));out.push({ref:it.ref,amt:a});left=r2(left-a);}
  if(left>0)out.push({ref:'ADVANCE',amt:left});
  return out;
}
function applyAlloc(cid,al){const c=cust(cid);al.forEach(a=>{if(a.ref==='OPENING')c.openRem=r2(c.openRem-a.amt);else if(a.ref!=='ADVANCE'){const s=sale(a.ref);s.balance=r2(s.balance-a.amt);s.received=r2(s.received+a.amt);}});}
function recordPayment(f,u){
  const cid=+f.customerId;if(!cid||!cust(cid))throw new Error('Select a customer');
  const amt=r2(num(f.amount));if(!(amt>0))throw new Error('Enter the amount');
  if(!PM.includes(f.mode))throw new Error('Select payment mode');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||''))throw new Error('Select a valid date');
  if(isClosed(f.date)&&u.role!=='ADMIN')throw new Error('This day is closed. Ask the Admin.');
  const due=openItems(cid).reduce((t,i)=>t+i.rem,0);
  if(amt>r2(due)+0.005&&!f.advance)throw new Error('Amount is more than the '+fm(due)+' due. Tick "accept as advance" to keep the extra.');
  const al=allocate(cid,amt,f.saleId||null);
  applyAlloc(cid,al);
  const keep=me;me=u;
  const p=addPayment({date:f.date,customerId:cid,saleId:f.saleId?+f.saleId:null,amount:amt,mode:f.mode,remarks:f.remarks,kind:'LATER',alloc:al});
  ledgerAdd(cid,f.date,'PAYMENT',f.saleId?+f.saleId:null,p.id,0,amt,f.remarks||'');
  audit('PAYMENT','payments',p.id,p.no+' '+fm(amt));me=keep;return p;
}
function adjust(f,u){
  const cid=+f.customerId,amt=r2(num(f.amount));if(!cust(cid))throw new Error('Select a customer');
  if(!amt)throw new Error('Enter an amount (use minus to reduce the balance)');if(!String(f.reason||'').trim())throw new Error('Enter the reason');
  const c=cust(cid);

function cancelSale(id,reason,u){
  const s=sale(id);if(!s||s.status!=='ACTIVE')throw new Error('Invoice not found or already cancelled');
  if(!String(reason||'').trim())throw new Error('Enter the reason');
  if(db.payments.some(p=>p.status==='ACTIVE'&&p.kind==='LATER'&&p.alloc.some(a=>a.ref===s.id)))throw new Error('Payments were recorded against this invoice later. Adjust those first.');
  const coll=db.payments.filter(p=>p.status==='ACTIVE'&&p.kind==='AT_SALE'&&p.saleId===s.id);
  const collected=r2(coll.reduce((t,p)=>t+p.amount,0));
  s.status='CANCELLED';s.cancelReason=reason;coll.forEach(p=>p.status='CANCELLED');
  if(s.customerId){ledgerAdd(s.customerId,today(),'CANCEL',s.id,null,collected,s.net,'Cancelled '+s.invoiceNo);}
  const keep=me;me=u;audit('SALE_CANCEL','sales',s.id,s.invoiceNo+' '+reason);me=keep;
}
function dayBook(from,to){
  const pays=livePay(),rows=[];
  let open=r2(db.company.openingCash+pays.filter(p=>p.mode==='Cash'&&p.date<from).reduce((t,p)=>t+p.amount,0)),d=from,n=0;
  while(d<=to&&n<400){
    const sl=liveSales().filter(s=>s.date===d),pd=pays.filter(p=>p.date===d);
    const retail=r2(sl.filter(s=>s.type==='RETAIL').reduce((t,s)=>t+s.net,0)),whole=r2(sl.filter(s=>s.type==='WHOLESALE').reduce((t,s)=>t+s.net,0));
    const cash=r2(pd.filter(p=>p.mode==='Cash').reduce((t,p)=>t+p.amount,0)),dig=r2(pd.filter(p=>p.mode!=='Cash').reduce((t,p)=>t+p.amount,0));
    const close=r2(open+cash-0);
    rows.push({date:d,opening:open,retail,wholesale:whole,cash,digital:dig,expenses:0,closing:close,closed:isClosed(d)?'Closed':'Open'});
    open=close;d=addDays(d,1);n++;
  }
  return rows;
}

  return `<h2>Company setup</h2><form class="card" data-form="company">${inp('Company name','name',c.name,'required')}${inp('Farm name','farmName',c.farmName,'required')}${inp('Address','address',c.address)}${inp('Mobile number','mobile',c.mobile)}${inp('GST number (optional)','gst',c.gst)}
  <div class="row"><label>Financial year<input name="fy" value="${esc(c.fy)}"></label><label>Currency<input name="currency" value="${esc(c.currency)}"></label></div>${inp('Opening cash (start of books)','openingCash',c.openingCash,'inputmode="decimal"')}
  <label>Logo<input type="file" name="logo" accept="image/*"></label>${c.logo?`<img src="${c.logo}" style="height:50px;margin-top:6px"> <button type="button" class="sm sec" data-act="rmLogo">Remove logo</button>`:''}<br><br><button class="big">Save company</button></form>
  <h3>Data tools (this test build stores data in this browser)</h3><div class="card"><div class="row"><button data-act="shareBackup">Back up to Google Drive</button><button class="sec" data-act="backup">Download backup</button><label class="btn sec" style="margin:0">Restore backup<input type="file" id="restoreFile" accept=".json" class="hide"></label></div><br><div class="row"><button class="sec" data-act="resetDemo">Reset to sample data</button><button class="red" data-act="clearAll">Delete all data</button></div></div>`;
}
function viewUsers(){
  return `<div class="row nf" style="justify-content:space-between"><h2>Users</h2><button data-act="userSheet">+ Add user</button></div><div class="card">${db.users.map(u=>`<div class="item"><span><b>${esc(u.name)}</b> <small class="mut">@${esc(u.username)}</small><br><small>${u.role==='ADMIN'?'Admin':'Sales Operator'}${u.canOverride&&u.role!=='ADMIN'?' · can override rate':''} · ${esc(u.mobile)}</small><br>${u.active?'<span class="badge">Active</span>':'<span class="badge r">Not active</span>'}</span><span class="row nf"><button class="sm sec" data-act="userSheet" data-id="${u.id}">Edit</button><button class="sm sec" data-act="pwSheet" data-id="${u.id}">Password</button></span></div>`).join('')}</div>`;
}
function viewPassword(){return `<h2>Change password</h2><form class="card" data-form="changepw"><label>Current password<input type="password" name="old" required></label><label>New password (8+ characters)<input type="password" name="n1" minlength="8" required></label><label>Repeat new password<input type="password" name="n2" required></label><br><button class="big">Change password</button></form>`;}

/* ===== render + events ===== */
function render(){
  if(!me){$('#app').innerHTML=viewAuth();return;}
  const h=hl(),p=h.p;let c='';
  if(p==='home')c=viewHome();else if(p==='sale')c=viewSale();else if(p==='invoice')c=viewInvoice(h.a);else if(p==='customers')c=viewCustomers();else if(p==='customer')c=viewCustomer(h.a);
  else if(p==='payments')c=viewPayments(S.payPre);else if(p==='rates')c=viewRates();else if(p==='daybook')c=viewDaybook();else if(p==='reports')c=viewReports();
  else if(p==='report'){const n=h.a;if(!REPORTS[n]||(!isAdmin()&&!OPREP.includes(n)&&!REPORTS[n].hidden))c='<p>Not allowed</p>';else c='<h2>'+REPORTS[n].t+'</h2>'+repView(n);}
  else if(p==='sales')c='<h2>Invoices</h2>'+repView('sales-list');
  else if(p==='more')c=viewMore();else if(p==='password')c=viewPassword();
  else if(p==='settings')c=isAdmin()?viewSettings():'<p>Admin only</p>';else if(p==='users')c=isAdmin()?viewUsers():'<p>Admin only</p>';
  else c=viewHome();
  $('#app').innerHTML=shell(c);window.scrollTo(0,0);
  if(p==='sale'){const f=$('#saleForm');(S.type==='RETAIL'?f.birds:f.custText).focus();recalc();}
  if(p==='payments'){S.payPre=null;fillInv();}
}
function recalc(){
  const f=$('#saleForm');if(!f)return;const ret=S.type==='RETAIL',mode=f.mode.value;
  const w=num(f.weight.value),r=num(f.rate.value),d=num(f.discount.value),fr=ret?0:num(f.freight&&f.freight.value);
  const gross=r2(w*r),net=r2(gross-d+fr);let cash=num(f.cash.value),upi=num(f.upi.value);
  $('#wCash').classList.toggle('hide',mode==='UPI'||mode==='CREDIT');$('#wUpi').classList.toggle('hide',mode==='CASH'||mode==='CREDIT');
  if(mode==='UPI')cash=0;if(mode==='CASH')upi=0;if(mode==='CREDIT'){cash=0;upi=0;}
  const rec=r2(cash+upi),chg=ret?Math.max(0,r2(rec-net)):0,bal=ret?Math.max(0,r2(net-rec)):r2(net-rec);
  $('#tGross').textContent=fm(gross);$('#tNet').textContent=fm(net);$('#tRec').textContent=fm(rec);$('#tBal').textContent=fm(bal);if($('#tChg'))$('#tChg').textContent=fm(chg);
  const lab=$('#wCash').firstChild;if(lab)lab.textContent=mode==='MIXED'?'Cash received':'Cash received';
}
function pickCust(){
  const f=$('#saleForm');const m=/\[(\d+)\]\s*$/.exec(f.custText.value);f.customerId.value=m?m[1]:'';
  const c=m?cust(m[1]):null;$('#custInfo').innerHTML=c?`Outstanding: <b class="${custBalance(c.id)>0?'red-t':''}">₹${fm(custBalance(c.id))}</b>${c.creditLimit?' · limit ₹'+fm(c.creditLimit):''}`:'';
}
function fillInv(){
  const cs=$('#payCust');if(!cs)return;const id=cs.value,ss=$('#paySale'),info=$('#payInfo');
  ss.innerHTML='<option value="">Oldest first (automatic)</option>';info.textContent='';
  if(!id)return;const c=cust(id);info.innerHTML=`Outstanding: <b>₹${fm(custBalance(id))}</b>`;
  openItems(id).filter(i=>i.ref!=='OPENING').forEach(i=>{const s=sale(i.ref);ss.innerHTML+=`<option value="${s.id}">${esc(s.invoiceNo)} · due ${fm(i.rem)}</option>`;});
}
function whatsapp(id){const s=sale(id),c=db.company;const t=`*${c.farmName}*\nInvoice: ${s.invoiceNo}\nDate: ${dmy(s.date)}\nBirds: ${s.birds}  Weight: ${fw(s.weight)} kg\nRate: ${fm(s.rate)}\nNet: ${fm(s.net)}\nReceived: ${fm(s.received)}\nBalance: ${fm(s.balance)}\nThank you!`;const cu=s.customerId?cust(s.customerId):null;const ph=cu&&cu.mobile?'91'+cu.mobile:'';window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(t),'_blank');}

const ACT={
 auth(e){S.auth=e.dataset.m;render();},
 logout(){audit('LOGOUT','users',me.id);save();try{localStorage.removeItem(SKEY);}catch(e){}me=null;ROUTE='/home';render();},
 stype(e){S.type=e.dataset.t;S.unlock=false;render();},
 unlock(e){S.unlock=!S.unlock;const d=$('#saleForm').date.value;S.saleDate=d;render();},
 closeSheet,
 print(){window.print();},
 wa(e){whatsapp(e.dataset.id);},
 view(e){go('#/invoice/'+e.dataset.id);},
 export(){exportReport(S.cur);},
 sort(e){const st=repState(S.cur),k=e.dataset.col;if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=1;}st.page=1;$('#repbody').innerHTML=repBody(S.cur);},
 page(e){repState(S.cur).page=+e.dataset.p;$('#repbody').innerHTML=repBody(S.cur);},
 payFor(e){S.payPre=e.dataset.id;go('#/payments');},
 stmt(e){const st=repState('statement');st.cust=e.dataset.id;st.from=monthStart().slice(0,5)+'01-01'>'x'?'':'';go('#/report/statement');},
 custSheet(e){const c=e.dataset.id?cust(e.dataset.id):null;sheet(c?'Edit customer':'Add customer',`<form data-form="customer"><input type="hidden" name="id" value="${c?c.id:''}">${inp('Customer name','name',c&&c.name,'required')}${inp('Mobile number','mobile',c&&c.mobile,'inputmode="numeric" maxlength="10"')}${inp('Address','address',c&&c.address)}${inp('Village / location','village',c&&c.village)}${inp('Credit limit (0 = no limit)','creditLimit',c?c.creditLimit:'','inputmode="decimal"')}${c?'':inp('Opening balance (amount already owed)','openingBalance','','inputmode="decimal"')}${c?`<label><input type="checkbox" name="active" ${c.active?'checked':''}> Active</label>`:''}<br><button class="big">Save customer</button></form>`);},
 adjSheet(e){sheet('Balance adjustment',`<form data-form="adjust"><input type="hidden" name="customerId" value="${e.dataset.id}"><p class="mut">Use a plus amount to increase what the customer owes, minus to reduce it.</p>${inp('Amount (+ or -)','amount','','inputmode="decimal" required')}${inp('Reason','reason','','required')}<br><button class="big">Post adjustment</button></form>`);},
 rateSheet(e){const r=e.dataset.id?db.rates.find(x=>x.id==e.dataset.id):null;sheet(r?'Edit rate':'New rate',`<form data-form="rate"><input type="hidden" name="id" value="${r?r.id:''}">${inp('Date','date',r?r.date:today(),'type="date" required')}${inp('Retail rate per kg','retail',r?r.retail:'','inputmode="decimal" required')}${inp('Wholesale rate per kg','wholesale',r?r.wholesale:'','inputmode="decimal" required')}${inp('Remarks','remarks',r?r.remarks:'')}<label><input type="checkbox" name="active" ${!r||r.active?'checked':''}> Active</label><br><button class="big">Save rate</button></form>`);},
 cancelSheet(e){sheet('Cancel invoice',`<form data-form="cancel"><input type="hidden" name="id" value="${e.dataset.id}"><p>Invoice ${esc(sale(e.dataset.id).invoiceNo)} will be cancelled and its balance reversed. This cannot be undone.</p>${inp('Reason','reason','','required')}<br><button class="big red">Cancel invoice</button></form>`);},
 closeDay(e){const d=e.dataset.d;if(isClosed(d)){delete db.closes[d];audit('DAY_REOPEN','daybook',d);}else{const r=dayBook(d,d)[0];db.closes[d]={closing:r.closing,by:me.username};audit('DAY_CLOSE','daybook',d,'Closing cash '+fm(r.closing));}save();render();toast('Done');},
 userSheet(e){const u=e.dataset.id?db.users.find(x=>x.id==e.dataset.id):null;sheet(u?'Edit user':'Add user',`<form data-form="user"><input type="hidden" name="id" value="${u?u.id:''}">${inp('Name','name',u&&u.name,'required')}${inp('Mobile','mobile',u&&u.mobile,'inputmode="numeric"')}${inp('Email','email',u&&u.email,'type="email"')}${inp('Username','username',u&&u.username,u?'readonly':'required autocapitalize="none"')}${u?'':'<label>Password (8+ characters)<input name="password" type="password" minlength="8" required></label>'}<label>Role<select name="role"><option value="OPERATOR" ${u&&u.role==='OPERATOR'?'selected':''}>Sales Operator</option><option value="ADMIN" ${u&&u.role==='ADMIN'?'selected':''}>Admin</option></select></label><label><input type="checkbox" name="canOverride" ${u&&u.canOverride?'checked':''}> Can override rate</label><label><input type="checkbox" name="active" ${!u||u.active?'checked':''}> Active</label><br><button class="big">Save user</button></form>`);},
 pwSheet(e){sheet('Reset password',`<form data-form="resetpw"><input type="hidden" name="id" value="${e.dataset.id}"><label>New password (8+ characters)<input name="pw" type="password" minlength="8" required></label><br><button class="big">Set password</button></form>`);},
 rmLogo(){db.company.logo='';save();render();},
 backup(){download(new Blob([JSON.stringify(db)],{type:'application/json'}),'broiler-backup-'+today()+'.json');markBackup();render();toast('Backup downloaded');},
 async shareBackup(){
  const name='broiler-backup-'+today()+'.json',text=JSON.stringify(db);
  let file=null;try{file=new File([text],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Broiler farm backup '+dmy(today())});markBackup();render();toast('Backup shared. If you chose Drive, it is saved.');return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  download(new Blob([text],{type:'application/json'}),name);markBackup();render();toast('Backup saved in Downloads. Open the Files app and upload it to Google Drive.');
 },
 resetDemo(){if(confirm('Replace everything with the sample data?')){const keep=me&&me.username;seed();save();me=db.users.find(u=>u.username===keep)||db.users[0];toast('Sample data loaded');go('#/home');}},
 clearAll(){if(confirm('Delete ALL data? This cannot be undone. An empty system with only the admin login will remain.')&&confirm('Really delete everything?')){const a=db.users[0];db={v:1,seq:{user:1},users:[a],company:Object.assign({},db.company),rates:[],customers:[],sales:[],payments:[],ledger:[],audit:[],counters:{},closes:{}};save();me=a;toast('All data deleted');go('#/home');}}
};
ACT.stmt=e=>{const st=repState('statement');st.cust=e.dataset.id;go('#/report/statement');};

const FORM={
 login(f){const un=f.username.value.trim().toLowerCase(),u=db.users.find(x=>x.username.toLowerCase()===un);
  if(!u)throw new Error('Wrong username or password');
  if(u.lockUntil>Date.now())throw new Error('Account locked for 15 minutes after too many wrong attempts');
  if(u.pw!==pwh(u.username,f.password.value)){u.fails=(u.fails||0)+1;if(u.fails>=5){u.lockUntil=Date.now()+15*60000;u.fails=0;}save();throw new Error('Wrong username or password');}
  if(!u.active)throw new Error('Your account is waiting for Admin approval');
  u.fails=0;me=u;try{localStorage.setItem(SKEY,JSON.stringify({id:u.id,exp:Date.now()+8*3600000}));}catch(e){}audit('LOGIN','users',u.id);save();go('#/home');},
 register(f){const un=f.username.value.trim();if(db.users.some(u=>u.username.toLowerCase()===un.toLowerCase()))throw new Error('Username already taken');
  if(!/^\d{10}$/.test(f.mobile.value))throw new Error('Mobile number must be 10 digits');
  db.users.push({id:nid('user'),username:un,name:f.name.value.trim(),mobile:f.mobile.value,email:f.email.value,pw:pwh(un,f.password.value),role:'OPERATOR',canOverride:false,active:false,fails:0,lockUntil:0,createdAt:new Date().toISOString()});
  audit('REGISTER','users',un);save();S.auth='login';render();toast('Registered. The Admin must approve your account.');},
 forgot(f){const u=db.users.find(x=>x.username.toLowerCase()===f.username.value.trim().toLowerCase()&&x.mobile===f.mobile.value.trim());
  if(!u)throw new Error('No matching user. Ask the Admin to reset your password.');const t='Tmp@'+Math.floor(1000+Math.random()*9000);u.pw=pwh(u.username,t);u.fails=0;u.lockUntil=0;save();
  S.auth='login';render();sheet('Temporary password','<p>Your temporary password is:</p><h2 style="text-align:center">'+t+'</h2><p class="mut">Login and change it from More → Change password.</p>');},
 sale(f){
  const s=createSale({type:S.type,date:f.date.value,customerId:f.customerId.value,birds:f.birds.value,weight:f.weight.value,rate:f.rate.value,discount:f.discount.value,freight:f.freight?f.freight.value:'0',mode:f.mode.value,cash:f.cash.value,upi:f.upi.value},me);
  save();S.saleDate=null;S.unlock=false;toast('Saved '+s.invoiceNo);go('#/invoice/'+s.id);},
 customer(f){const id=f.id.value;
  if(id){const c=cust(id),mob=f.mobile.value.trim();if(mob&&!/^\d{10}$/.test(mob))throw new Error('Mobile number must be 10 digits');if(mob&&db.customers.some(x=>x.mobile===mob&&x.id!==c.id))throw new Error('This mobile number already exists');
   c.name=f.name.value.trim();c.mobile=mob;c.address=f.address.value;c.village=f.village.value;c.creditLimit=r2(num(f.creditLimit.value));c.active=f.active.checked;audit('CUSTOMER_EDIT','customers',c.id,c.name);}
  else addCustomer({name:f.name.value,mobile:f.mobile.value,address:f.address.value,village:f.village.value,creditLimit:f.creditLimit.value,openingBalance:f.openingBalance.value},today());
  save();closeSheet();render();toast('Customer saved');},
 payment(f){const p=recordPayment({date:f.date.value,customerId:f.customerId.value,saleId:f.saleId.value,amount:f.amount.value,mode:f.mode.value,remarks:f.remarks.value,advance:f.advance.checked},me);save();render();toast('Payment '+p.no+' saved');},
 adjust(f){adjust({customerId:f.customerId.value,amount:f.amount.value,reason:f.reason.value},me);save();closeSheet();render();toast('Adjustment posted');},
 rate(f){if(!isAdmin())throw new Error('Admin only');const rt=r2(num(f.retail.value)),wh=r2(num(f.wholesale.value));if(!(rt>0)||!(wh>0))throw new Error('Enter both rates');
  if(f.id.value){const r=db.rates.find(x=>x.id==f.id.value);Object.assign(r,{date:f.date.value,retail:rt,wholesale:wh,remarks:f.remarks.value,active:f.active.checked});audit('RATE_EDIT','rates',r.id,rt+'/'+wh);}
  else{const r={id:nid('rate'),date:f.date.value,retail:rt,wholesale:wh,remarks:f.remarks.value,active:f.active.checked,createdAt:new Date().toISOString().slice(0,10)===f.date.value?new Date().toISOString().slice(0,19):f.date.value+'T08:00:00',createdBy:me.username};db.rates.push(r);audit('RATE_ADD','rates',r.id,rt+'/'+wh);}
  save();closeSheet();render();toast('Rate saved');},
 cancel(f){cancelSale(f.id.value,f.reason.value,me);save();closeSheet();render();toast('Invoice cancelled');},
 company(f){const c=db.company;Object.assign(c,{name:f.name.value,farmName:f.farmName.value,address:f.address.value,mobile:f.mobile.value,gst:f.gst.value,fy:f.fy.value,currency:f.currency.value,openingCash:r2(num(f.openingCash.value))});
  const file=f.logo.files[0];const done=()=>{audit('COMPANY_EDIT','company',1);save();render();toast('Company saved');};
  if(file){if(file.size>300000)throw new Error('Logo must be under 300 KB');const rd=new FileReader();rd.onload=()=>{c.logo=rd.result;done();};rd.readAsDataURL(file);}else done();},
 user(f){if(!isAdmin())throw new Error('Admin only');
  if(f.id.value){const u=db.users.find(x=>x.id==f.id.value);if(u.id===me.id&&(!f.active.checked||f.role.value!=='ADMIN'))throw new Error('You cannot remove your own admin access');Object.assign(u,{name:f.name.value,mobile:f.mobile.value,email:f.email.value,role:f.role.value,canOverride:f.canOverride.checked,active:f.active.checked});audit('USER_EDIT','users',u.id);}
  else{const un=f.username.value.trim();if(db.users.some(u=>u.username.toLowerCase()===un.toLowerCase()))throw new Error('Username already taken');db.users.push({id:nid('user'),username:un,name:f.name.value,mobile:f.mobile.value,email:f.email.value,pw:pwh(un,f.password.value),role:f.role.value,canOverride:f.canOverride.checked,active:f.active.checked,fails:0,lockUntil:0,createdAt:new Date().toISOString()});audit('USER_ADD','users',un);}
  save();closeSheet();render();toast('User saved');},
 resetpw(f){const u=db.users.find(x=>x.id==f.id.value);if(f.pw.value.length<8)throw new Error('Password must be 8+ characters');u.pw=pwh(u.username,f.pw.value);u.fails=0;u.lockUntil=0;audit('PASSWORD_RESET','users',u.id);save();closeSheet();toast('Password set');},
 changepw(f){if(me.pw!==pwh(me.username,f.old.value))throw new Error('Current password is wrong');if(f.n1.value.length<8)throw new Error('New password must be 8+ characters');if(f.n1.value!==f.n2.value)throw new Error('New passwords do not match');me.pw=pwh(me.username,f.n1.value);audit('PASSWORD_CHANGE','users',me.id);save();f.reset();toast('Password changed');}
};

function init(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  load();
  try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.exp>Date.now()){const u=db.users.find(x=>x.id===s.id&&x.active);if(u)me=u;}}catch(e){}
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');if(a){e.preventDefault();const f=ACT[a.dataset.act];if(f){try{Promise.resolve(f(a)).catch(er=>toast(er.message,1));}catch(er){toast(er.message,1);}}return;}
    const l=e.target.closest('a[href^="#/"]');if(l){e.preventDefault();go(l.getAttribute('href'));return;}
    if(e.target.id==='sheet')closeSheet();
  });
  document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();try{FORM[f.dataset.form](f);}catch(er){toast(er.message,1);}});
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.form&&t.form.id==='saleForm'){if(t.name==='custText')pickCust();recalc();}
    if(t.dataset&&t.dataset.rf&&S.cur){const st=repState(S.cur);st[t.dataset.rf]=t.dataset.rf==='size'?+t.value:t.value;st.page=1;if(S.cur==='daybook'&&(t.dataset.rf==='from'||t.dataset.rf==='to')){if(t.dataset.rf==='from'&&(!st.to||st.to<st.from))st.to=st.from;render();return;}$('#repbody').innerHTML=repBody(S.cur);}
    if(t.id==='custQ'){S.custQ=t.value;const p=t.selectionStart;render();const n=$('#custQ');n.focus();n.setSelectionRange(p,p);}
    if(t.id==='dashDate'){S.dash=t.value||today();render();}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='payCust')fillInv();
    if(t.name==='date'&&t.form&&t.form.id==='saleForm'){S.saleDate=t.value;const keep={};['birds','weight','discount','freight','cash','upi','custText','customerId'].forEach(k=>{if(t.form[k])keep[k]=t.form[k].value;});render();const f=$('#saleForm');Object.keys(keep).forEach(k=>{if(f[k])f[k].value=keep[k];});pickCust();recalc();}
    if(t.id==='restoreFile'&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||!x.users||!x.sales)throw new Error('Not a valid backup file');if(!confirm('Replace current data with this backup?'))return;db=x;save();me=db.users.find(u=>u.id===(me&&me.id))||null;go('#/home');toast('Backup restored');}catch(er){toast(er.message,1);}};rd.readAsText(t.files[0]);}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeSheet();
    if(e.key==='Enter'&&e.target.form&&e.target.form.id==='saleForm'&&e.target.tagName==='INPUT'&&e.target.type!=='radio'){
      e.preventDefault();const els=[...e.target.form.querySelectorAll('input:not([type=hidden]):not([readonly]):not([type=radio]),button[type=submit]')].filter(x=>x.offsetParent!==null);
      const i=els.indexOf(e.target);if(els[i+1])els[i+1].focus();
    }
  });
  const fromHash=()=>{const h=location.hash;if(h.startsWith('#/')&&h.slice(1)!==ROUTE){ROUTE=h.slice(1);render();}};
  window.addEventListener('hashchange',fromHash);window.addEventListener('popstate',fromHash);
  ROUTE=location.hash.startsWith('#/')?location.hash.slice(1):'/home';
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
}
if(typeof document!=='undefined'&&document.addEventListener&&!window.__TEST)init();
</script>
